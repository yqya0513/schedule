<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 画面固定とズーム防止の設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>タスク＆スケジュール管理</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e8ed;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* ヘッダー・タブナビゲーション */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: #fff;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* コンテナ */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 12px;
            width: 100%;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #666;
        }

        /* フォーカス時の自動ズームを防ぐため font-size を 16px に設定 */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100% !important;
            max-width: 100% !important;
            height: 42px !important;
            box-sizing: border-box !important;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px !important;
            background-color: #fff;
            display: block;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* スクロール（ドラム風）操作時のカーソルスタイル */
        select.wheel-scrollable {
            cursor: ns-resize;
        }

        /* 時間・分を横並びにするレイアウト */
        .time-select-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .time-select-group select {
            flex: 1;
        }

        .time-select-group span {
            font-size: 12px;
            color: #666;
        }

        .form-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .form-row .form-group {
            flex: 1;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button.btn-danger {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* リスト表示 */
        .item-list {
            list-style: none;
            margin-top: 16px;
        }

        .item-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* スケジュール（予定タブ）表示 - 上部入力フォーム削除に伴い高さ領域を拡大 */
        .time-grid-container {
            max-height: calc(100vh - 170px);
            overflow-y: auto;
            margin-top: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            position: relative;
        }

        .time-grid {
            position: relative;
            background: var(--card-bg);
            height: 1440px; /* 24時間 * 60px */
            padding-left: 45px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .time-slot-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 1px solid #f0f0f0;
            font-size: 10px;
            color: #999;
            padding-left: 4px;
            pointer-events: none;
        }

        /* 現在時刻ライン */
        .current-time-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 2px solid #e74c3c;
            z-index: 20;
            pointer-events: none;
        }

        .current-time-line::before {
            content: '';
            position: absolute;
            left: 40px;
            top: -4px;
            width: 6px;
            height: 6px;
            background-color: #e74c3c;
            border-radius: 50%;
        }

        .schedule-item {
            position: absolute;
            background-color: rgba(74, 144, 226, 0.2);
            border-left: 4px solid var(--primary-color);
            padding: 4px 6px;
            font-size: 12px;
            border-radius: 2px;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 10;
        }

        .schedule-item:hover {
            background-color: rgba(74, 144, 226, 0.3);
        }

        /* モーダル（ポップアップ） */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <header>
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('schedule')">予定</button>
            <button class="tab-btn" onclick="switchTab('todo')">TODO</button>
            <button class="tab-btn" onclick="switchTab('daily')">毎日</button>
            <button class="tab-btn" onclick="switchTab('monthly')">毎月</button>
            <button class="tab-btn" onclick="switchTab('recurring')">定期</button>
            <button class="tab-btn" onclick="switchTab('settings')">設定</button>
        </nav>
    </header>

    <div class="container">
        <!-- 予定 タブ -->
        <div id="tab-schedule" class="tab-content active">
            <button class="btn-danger" style="width: 100%;" onclick="clearTodaySchedule()">本日の予定を一括削除</button>

            <div class="time-grid-container" id="grid-container">
                <div id="schedule-grid" class="time-grid" onclick="handleGridClick(event)"></div>
            </div>
        </div>

        <!-- TODO タブ -->
        <div id="tab-todo" class="tab-content">
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="todo-input">
            </div>
            <div class="form-group">
                <label>期限</label>
                <input type="date" id="todo-date">
            </div>
            <button class="btn-primary" onclick="addTodo()">追加</button>
            <ul id="todo-list" class="item-list"></ul>
        </div>

        <!-- 毎日 タブ -->
        <div id="tab-daily" class="tab-content">
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="daily-input">
            </div>
            <div class="form-group">
                <label>所要時間 (分)</label>
                <input type="number" id="daily-duration">
            </div>
            <button class="btn-primary" onclick="addDaily()">追加</button>
            <ul id="daily-list" class="item-list"></ul>
        </div>

        <!-- 毎月 タブ -->
        <div id="tab-monthly" class="tab-content">
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="monthly-input">
            </div>
            <div class="form-group">
                <label>日時・曜日</label>
                <input type="text" id="monthly-timing">
            </div>
            <button class="btn-primary" onclick="addMonthly()">追加</button>
            <ul id="monthly-list" class="item-list"></ul>
        </div>

        <!-- 定期 タブ -->
        <div id="tab-recurring" class="tab-content">
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="recurring-input">
            </div>
            <div class="form-group">
                <label>日時・時間</label>
                <input type="text" id="recurring-timing">
            </div>
            <button class="btn-primary" onclick="addRecurring()">追加</button>
            <ul id="recurring-list" class="item-list"></ul>
        </div>

        <!-- 設定 タブ -->
        <div id="tab-settings" class="tab-content">
            <div style="margin-top: 8px;">
                <h3 style="font-size: 16px; margin-bottom: 12px;">データ管理</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button class="btn-secondary" style="flex: 1;" onclick="exportData()">データのエクスポート</button>
                    <button class="btn-secondary" style="flex: 1;" onclick="triggerImport()">データのインポート</button>
                </div>
                <input type="file" id="import-file" style="display: none;" onchange="importData(event)" accept=".json">
            </div>
        </div>
    </div>

    <!-- 予定追加・編集用モーダル -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title-text">予定の追加</h3>
            <div class="form-group" style="margin-top: 12px;">
                <label>内容</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>開始時間</label>
                <div class="time-select-group">
                    <select id="edit-start-hour" class="wheel-scrollable"></select><span>時</span>
                    <select id="edit-start-min" class="wheel-scrollable"></select><span>分</span>
                </div>
            </div>
            <div class="form-group">
                <label>終了時間</label>
                <div class="time-select-group">
                    <select id="edit-end-hour" class="wheel-scrollable"></select><span>時</span>
                    <select id="edit-end-min" class="wheel-scrollable"></select><span>分</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
                <button class="btn-danger" id="modal-delete-btn" onclick="deleteSchedule()">削除</button>
                <button class="btn-primary" style="margin-top:0;" onclick="saveScheduleEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // データストア
        let todos = [];
        let dailies = [];
        let monthlies = [];
        let recurrings = [];
        let schedules = [];
        let currentEditId = null;

        // 時間・分 ドロップダウンの生成（時間は0〜23、分は5分単位）
        function populateTimeSelects() {
            const hourIds = ['edit-start-hour', 'edit-end-hour'];
            const minIds = ['edit-start-min', 'edit-end-min'];

            let hourHtml = '<option value="">--</option>';
            for (let h = 0; h < 24; h++) {
                const val = String(h).padStart(2, '0');
                hourHtml += `<option value="${val}">${val}</option>`;
            }
            hourIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = hourHtml;
            });

            let minHtml = '<option value="">--</option>';
            for (let m = 0; m < 60; m += 5) {
                const val = String(m).padStart(2, '0');
                minHtml += `<option value="${val}">${val}</option>`;
            }
            minIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = minHtml;
            });

            // マウスホイール/トラックパッドによるドラムスクロール動作の設定
            document.querySelectorAll('.wheel-scrollable').forEach(selectEl => {
                selectEl.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    if (this.options.length <= 1) return;

                    let index = this.selectedIndex;
                    if (e.deltaY > 0) {
                        // 下スクロール
                        if (index < this.options.length - 1) {
                            this.selectedIndex = index + 1;
                        }
                    } else {
                        // 上スクロール
                        if (index > 0) {
                            this.selectedIndex = index - 1;
                        }
                    }
                }, { passive: false });
            });
        }

        // 時間・分の設定ヘルパー
        function setSelectValue(prefix, timeStr) {
            if (!timeStr) {
                document.getElementById(`${prefix}-hour`).value = '';
                document.getElementById(`${prefix}-min`).value = '';
                return;
            }
            const [h, m] = timeStr.split(':');
            document.getElementById(`${prefix}-hour`).value = h;
            document.getElementById(`${prefix}-min`).value = m;
        }

        function getSelectValue(prefix) {
            const h = document.getElementById(`${prefix}-hour`).value;
            const m = document.getElementById(`${prefix}-min`).value;
            if (h === '' || m === '') return null;
            return `${h}:${m}`;
        }

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'schedule') {
                scrollToCurrentTimeMinusOneHour();
            }
        }

        // TODO 追加
        function addTodo() {
            const input = document.getElementById('todo-input');
            const date = document.getElementById('todo-date');
            if (!input.value) return;

            todos.push({ id: Date.now(), text: input.value, date: date.value });
            input.value = '';
            date.value = '';
            renderTodos();
        }

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            todos.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${item.date}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteTodo(id) {
            todos = todos.filter(item => item.id !== id);
            renderTodos();
        }

        // 毎日 追加
        function addDaily() {
            const input = document.getElementById('daily-input');
            const duration = document.getElementById('daily-duration');
            if (!input.value) return;

            dailies.push({ id: Date.now(), text: input.value, duration: duration.value });
            input.value = '';
            duration.value = '';
            renderDailies();
        }

        function renderDailies() {
            const list = document.getElementById('daily-list');
            list.innerHTML = '';
            dailies.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${item.duration ? item.duration + '分' : ''}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteDaily(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteDaily(id) {
            dailies = dailies.filter(item => item.id !== id);
            renderDailies();
        }

        // 毎月 追加
        function addMonthly() {
            const input = document.getElementById('monthly-input');
            const timing = document.getElementById('monthly-timing');
            if (!input.value) return;

            monthlies.push({ id: Date.now(), text: input.value, timing: timing.value });
            input.value = '';
            timing.value = '';
            renderMonthlies();
        }

        function renderMonthlies() {
            const list = document.getElementById('monthly-list');
            list.innerHTML = '';
            monthlies.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${escapeHtml(item.timing)}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteMonthly(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteMonthly(id) {
            monthlies = monthlies.filter(item => item.id !== id);
            renderMonthlies();
        }

        // 定期 追加
        function addRecurring() {
            const input = document.getElementById('recurring-input');
            const timing = document.getElementById('recurring-timing');
            if (!input.value) return;

            recurrings.push({ id: Date.now(), text: input.value, timing: timing.value });
            input.value = '';
            timing.value = '';
            renderRecurrings();
        }

        function renderRecurrings() {
            const list = document.getElementById('recurring-list');
            list.innerHTML = '';
            recurrings.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${escapeHtml(item.timing)}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteRecurring(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteRecurring(id) {
            recurrings = recurrings.filter(item => item.id !== id);
            renderRecurrings();
        }

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function minutesToTime(mins) {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            if (h >= 24) h = 23;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function renderSchedule() {
            const grid = document.getElementById('schedule-grid');
            grid.innerHTML = '';

            // 時間軸の線
            for (let i = 0; i < 24; i++) {
                const line = document.createElement('div');
                line.className = 'time-slot-line';
                line.style.top = `${i * 60}px`;
                line.innerText = `${String(i).padStart(2, '0')}:00`;
                grid.appendChild(line);
            }

            // 現在時刻の赤線
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const timeLine = document.createElement('div');
            timeLine.className = 'current-time-line';
            timeLine.style.top = `${currentMin}px`;
            grid.appendChild(timeLine);

            const items = schedules.map(s => ({
                ...s,
                startMin: timeToMinutes(s.start),
                endMin: timeToMinutes(s.end)
            })).sort((a, b) => a.startMin - b.startMin);

            const columns = [];
            items.forEach(item => {
                let placed = false;
                for (let i = 0; i < columns.length; i++) {
                    const lastItemInCol = columns[i][columns[i].length - 1];
                    if (lastItemInCol.endMin <= item.startMin) {
                        columns[i].push(item);
                        item.colIndex = i;
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    item.colIndex = columns.length;
                    columns.push([item]);
                }
            });

            const gridWidth = grid.clientWidth - 45;

            items.forEach(item => {
                const overlapping = items.filter(other => 
                    Math.max(item.startMin, other.startMin) < Math.min(item.endMin, other.endMin)
                );
                const maxCols = Math.max(...overlapping.map(o => o.colIndex)) + 1;

                const el = document.createElement('div');
                el.className = 'schedule-item';
                
                const top = item.startMin;
                const height = Math.max(item.endMin - item.startMin, 15);
                const itemWidth = gridWidth / maxCols;
                const left = 45 + (itemWidth * item.colIndex);

                el.style.top = `${top}px`;
                el.style.height = `${height}px`;
                el.style.width = `${itemWidth}px`;
                el.style.left = `${left}px`;

                el.innerText = `${item.title} (${item.start}~${item.end})`;
                el.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(item.id);
                };

                grid.appendChild(el);
            });
        }

        // 現在時刻の1時間前にスクロール
        function scrollToCurrentTimeMinusOneHour() {
            const container = document.getElementById('grid-container');
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const targetMin = Math.max(0, currentMin - 60);
            container.scrollTop = targetMin;
        }

        // タイムグリッドタップによる予定追加（初期表示は00分または30分に設定）
        function handleGridClick(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const clickY = event.clientY - rect.top;
            
            let startMins = Math.floor(clickY); // 1px = 1分
            if (startMins >= 1440) startMins = 1439;

            let hour = Math.floor(startMins / 60);
            let rawMin = startMins % 60;
            
            // タップ位置の「分」を 00 または 30 にまるめる
            let roundedMin = rawMin < 30 ? 0 : 30;

            let startMinsFinal = hour * 60 + roundedMin;
            let endMinsFinal = startMinsFinal + 30;
            if (endMinsFinal > 1440) endMinsFinal = 1440;

            const startStr = minutesToTime(startMinsFinal);
            const endStr = minutesToTime(endMinsFinal);

            currentEditId = null;
            document.getElementById('modal-title-text').innerText = '予定の追加';
            document.getElementById('edit-title').value = '';
            setSelectValue('edit-start', startStr);
            setSelectValue('edit-end', endStr);
            document.getElementById('modal-delete-btn').style.display = 'none';

            document.getElementById('edit-modal').classList.add('open');
        }

        function clearTodaySchedule() {
            schedules = [];
            renderSchedule();
        }

        // モーダル制御
        function openEditModal(id) {
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            currentEditId = id;
            document.getElementById('modal-title-text').innerText = '予定の編集';
            document.getElementById('edit-title').value = item.title;
            setSelectValue('edit-start', item.start);
            setSelectValue('edit-end', item.end);
            document.getElementById('modal-delete-btn').style.display = 'block';

            document.getElementById('edit-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('open');
            currentEditId = null;
        }

        function saveScheduleEdit() {
            const title = document.getElementById('edit-title').value;
            const start = getSelectValue('edit-start');
            const end = getSelectValue('edit-end');

            if (!title || !start || !end) return;

            if (currentEditId) {
                const item = schedules.find(s => s.id === currentEditId);
                if (item) {
                    item.title = title;
                    item.start = start;
                    item.end = end;
                }
            } else {
                schedules.push({
                    id: Date.now(),
                    title: title,
                    start: start,
                    end: end
                });
            }

            closeModal();
            renderSchedule();
        }

        function deleteSchedule() {
            if (!currentEditId) return;
            schedules = schedules.filter(s => s.id !== currentEditId);
            closeModal();
            renderSchedule();
        }

        // エクスポート・インポート機能
        function exportData() {
            const data = {
                todos,
                dailies,
                monthlies,
                recurrings,
                schedules
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('import-file').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.todos) todos = data.todos;
                    if (data.dailies) dailies = data.dailies;
                    if (data.monthlies) monthlies = data.monthlies;
                    if (data.recurrings) recurrings = data.recurrings;
                    if (data.schedules) schedules = data.schedules;

                    renderTodos();
                    renderDailies();
                    renderMonthlies();
                    renderRecurrings();
                    renderSchedule();

                    alert('データをインポートしました。');
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // 初期化
        populateTimeSelects();
        renderSchedule();
        setTimeout(scrollToCurrentTimeMinusOneHour, 100);
    </script>
</body>
</html>
