<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク＆スケジュール管理</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e8ed;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* ヘッダー・タブナビゲーション */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: #fff;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* コンテナ */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* タイトルヘッダー */
        .section-header {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 12px;
            width: 100%;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #666;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100% !important;
            max-width: 100% !important;
            height: 42px !important; /* 縦の長さを内容の入力枠と同一に固定 */
            box-sizing: border-box !important;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            display: block;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .form-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .form-row .form-group {
            flex: 1;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button.btn-danger {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* リスト表示 */
        .item-list {
            list-style: none;
            margin-top: 16px;
        }

        .item-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* スケジュール（予定タブ）表示 */
        .time-grid {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 16px;
            height: 1440px; /* 24時間 * 60px */
            padding-left: 45px; /* 時間表記との被りを防ぐための余白 */
            box-sizing: border-box;
        }

        .time-slot-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 1px solid #f0f0f0;
            font-size: 10px;
            color: #999;
            padding-left: 4px;
            pointer-events: none;
        }

        .schedule-item {
            position: absolute;
            background-color: rgba(74, 144, 226, 0.2);
            border-left: 4px solid var(--primary-color);
            padding: 4px 6px;
            font-size: 12px;
            border-radius: 2px;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 10;
        }

        .schedule-item:hover {
            background-color: rgba(74, 144, 226, 0.3);
        }

        /* モーダル（ポップアップ） */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <header>
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('schedule')">予定</button>
            <button class="tab-btn" onclick="switchTab('todo')">TODO</button>
            <button class="tab-btn" onclick="switchTab('daily')">毎日</button>
            <button class="tab-btn" onclick="switchTab('monthly')">毎月</button>
            <button class="tab-btn" onclick="switchTab('recurring')">定期</button>
            <button class="tab-btn" onclick="switchTab('settings')">設定</button>
        </nav>
    </header>

    <div class="container">
        <!-- 予定 タブ（一番左へ移動） -->
        <div id="tab-schedule" class="tab-content active">
            <div class="section-header">
                <h2 class="section-title">予定</h2>
            </div>
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="schedule-title">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>開始時間</label>
                    <select id="schedule-start"></select>
                </div>
                <div class="form-group">
                    <label>終了時間</label>
                    <select id="schedule-end"></select>
                </div>
            </div>
            <button class="btn-primary" onclick="addSchedule()">予定を追加</button>
            <button class="btn-danger" style="width: 100%; margin-top: 8px;" onclick="clearTodaySchedule()">本日の予定を一括削除</button>

            <div id="schedule-grid" class="time-grid"></div>
        </div>

        <!-- TODO タブ -->
        <div id="tab-todo" class="tab-content">
            <div class="section-header">
                <h2 class="section-title">TODO</h2>
            </div>
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="todo-input">
            </div>
            <div class="form-group">
                <label>期限</label>
                <input type="date" id="todo-date">
            </div>
            <button class="btn-primary" onclick="addTodo()">追加</button>
            <ul id="todo-list" class="item-list"></ul>
        </div>

        <!-- 毎日 タブ -->
        <div id="tab-daily" class="tab-content">
            <div class="section-header">
                <h2 class="section-title">毎日</h2>
            </div>
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="daily-input">
            </div>
            <div class="form-group">
                <label>所要時間 (分)</label>
                <input type="number" id="daily-duration">
            </div>
            <button class="btn-primary" onclick="addDaily()">追加</button>
            <ul id="daily-list" class="item-list"></ul>
        </div>

        <!-- 毎月 タブ -->
        <div id="tab-monthly" class="tab-content">
            <div class="section-header">
                <h2 class="section-title">毎月</h2>
            </div>
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="monthly-input">
            </div>
            <div class="form-group">
                <label>日時・曜日</label>
                <input type="text" id="monthly-timing">
            </div>
            <button class="btn-primary" onclick="addMonthly()">追加</button>
            <ul id="monthly-list" class="item-list"></ul>
        </div>

        <!-- 定期 タブ -->
        <div id="tab-recurring" class="tab-content">
            <div class="section-header">
                <h2 class="section-title">定期</h2>
            </div>
            <div class="form-group">
                <label>内容</label>
                <input type="text" id="recurring-input">
            </div>
            <div class="form-group">
                <label>日時・時間</label>
                <input type="text" id="recurring-timing">
            </div>
            <button class="btn-primary" onclick="addRecurring()">追加</button>
            <ul id="recurring-list" class="item-list"></ul>
        </div>

        <!-- 設定 タブ -->
        <div id="tab-settings" class="tab-content">
            <div class="section-header">
                <h2 class="section-title">設定</h2>
            </div>
            <div style="margin-top: 20px;">
                <h3 style="font-size: 16px; margin-bottom: 12px;">データ管理</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button class="btn-secondary" style="flex: 1;" onclick="exportData()">データのエクスポート</button>
                    <button class="btn-secondary" style="flex: 1;" onclick="triggerImport()">データのインポート</button>
                </div>
                <input type="file" id="import-file" style="display: none;" onchange="importData(event)" accept=".json">
            </div>
        </div>
    </div>

    <!-- 予定編集用モーダル -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>予定の編集</h3>
            <div class="form-group" style="margin-top: 12px;">
                <label>内容</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>開始時間</label>
                <select id="edit-start"></select>
            </div>
            <div class="form-group">
                <label>終了時間</label>
                <select id="edit-end"></select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
                <button class="btn-danger" onclick="deleteSchedule()">削除</button>
                <button class="btn-primary" style="margin-top:0;" onclick="saveScheduleEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // データストア
        let todos = [];
        let dailies = [];
        let monthlies = [];
        let recurrings = [];
        let schedules = [];
        let currentEditId = null;

        // 5分単位の時間選択肢を生成する初期化関数
        function populateTimeSelects() {
            const timeSelectIds = ['schedule-start', 'schedule-end', 'edit-start', 'edit-end'];
            const options = ['<option value="">選択してください</option>'];

            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 5) {
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    options.push(`<option value="${timeStr}">${timeStr}</option>`);
                }
            }

            const html = options.join('');
            timeSelectIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = html;
            });
        }

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // TODO 追加
        function addTodo() {
            const input = document.getElementById('todo-input');
            const date = document.getElementById('todo-date');
            if (!input.value) return;

            todos.push({ id: Date.now(), text: input.value, date: date.value });
            input.value = '';
            date.value = '';
            renderTodos();
        }

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            todos.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${item.date}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteTodo(id) {
            todos = todos.filter(item => item.id !== id);
            renderTodos();
        }

        // 毎日 追加
        function addDaily() {
            const input = document.getElementById('daily-input');
            const duration = document.getElementById('daily-duration');
            if (!input.value) return;

            dailies.push({ id: Date.now(), text: input.value, duration: duration.value });
            input.value = '';
            duration.value = '';
            renderDailies();
        }

        function renderDailies() {
            const list = document.getElementById('daily-list');
            list.innerHTML = '';
            dailies.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${item.duration ? item.duration + '分' : ''}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteDaily(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteDaily(id) {
            dailies = dailies.filter(item => item.id !== id);
            renderDailies();
        }

        // 毎月 追加
        function addMonthly() {
            const input = document.getElementById('monthly-input');
            const timing = document.getElementById('monthly-timing');
            if (!input.value) return;

            monthlies.push({ id: Date.now(), text: input.value, timing: timing.value });
            input.value = '';
            timing.value = '';
            renderMonthlies();
        }

        function renderMonthlies() {
            const list = document.getElementById('monthly-list');
            list.innerHTML = '';
            monthlies.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${escapeHtml(item.timing)}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteMonthly(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteMonthly(id) {
            monthlies = monthlies.filter(item => item.id !== id);
            renderMonthlies();
        }

        // 定期 追加
        function addRecurring() {
            const input = document.getElementById('recurring-input');
            const timing = document.getElementById('recurring-timing');
            if (!input.value) return;

            recurrings.push({ id: Date.now(), text: input.value, timing: timing.value });
            input.value = '';
            timing.value = '';
            renderRecurrings();
        }

        function renderRecurrings() {
            const list = document.getElementById('recurring-list');
            list.innerHTML = '';
            recurrings.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div>
                        <div>${escapeHtml(item.text)}</div>
                        <small style="color:#888;">${escapeHtml(item.timing)}</small>
                    </div>
                    <button class="btn-danger" onclick="deleteRecurring(${item.id})">削除</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteRecurring(id) {
            recurrings = recurrings.filter(item => item.id !== id);
            renderRecurrings();
        }

        // 予定 追加
        function addSchedule() {
            const title = document.getElementById('schedule-title').value;
            const start = document.getElementById('schedule-start').value;
            const end = document.getElementById('schedule-end').value;

            if (!title || !start || !end) return;

            schedules.push({
                id: Date.now(),
                title: title,
                start: start,
                end: end
            });

            document.getElementById('schedule-title').value = '';
            document.getElementById('schedule-start').value = '';
            document.getElementById('schedule-end').value = '';

            renderSchedule();
        }

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function renderSchedule() {
            const grid = document.getElementById('schedule-grid');
            grid.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const line = document.createElement('div');
                line.className = 'time-slot-line';
                line.style.top = `${i * 60}px`;
                line.innerText = `${String(i).padStart(2, '0')}:00`;
                grid.appendChild(line);
            }

            const items = schedules.map(s => ({
                ...s,
                startMin: timeToMinutes(s.start),
                endMin: timeToMinutes(s.end)
            })).sort((a, b) => a.startMin - b.startMin);

            const columns = [];
            items.forEach(item => {
                let placed = false;
                for (let i = 0; i < columns.length; i++) {
                    const lastItemInCol = columns[i][columns[i].length - 1];
                    if (lastItemInCol.endMin <= item.startMin) {
                        columns[i].push(item);
                        item.colIndex = i;
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    item.colIndex = columns.length;
                    columns.push([item]);
                }
            });

            // 左側の時間表記幅（45px分）を除いた可動領域を基準に配置
            const gridWidth = grid.clientWidth - 45;

            items.forEach(item => {
                const overlapping = items.filter(other => 
                    Math.max(item.startMin, other.startMin) < Math.min(item.endMin, other.endMin)
                );
                const maxCols = Math.max(...overlapping.map(o => o.colIndex)) + 1;

                const el = document.createElement('div');
                el.className = 'schedule-item';
                
                const top = item.startMin;
                const height = Math.max(item.endMin - item.startMin, 15);
                const itemWidth = gridWidth / maxCols;
                const left = 45 + (itemWidth * item.colIndex);

                el.style.top = `${top}px`;
                el.style.height = `${height}px`;
                el.style.width = `${itemWidth}px`;
                el.style.left = `${left}px`;

                el.innerText = `${item.title} (${item.start}~${item.end})`;
                el.onclick = () => openEditModal(item.id);

                grid.appendChild(el);
            });
        }

        function clearTodaySchedule() {
            schedules = [];
            renderSchedule();
        }

        // 編集モーダル制御
        function openEditModal(id) {
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            currentEditId = id;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-start').value = item.start;
            document.getElementById('edit-end').value = item.end;

            document.getElementById('edit-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('open');
            currentEditId = null;
        }

        function saveScheduleEdit() {
            if (!currentEditId) return;

            const title = document.getElementById('edit-title').value;
            const start = document.getElementById('edit-start').value;
            const end = document.getElementById('edit-end').value;

            if (!title || !start || !end) return;

            const item = schedules.find(s => s.id === currentEditId);
            if (item) {
                item.title = title;
                item.start = start;
                item.end = end;
            }

            closeModal();
            renderSchedule();
        }

        function deleteSchedule() {
            if (!currentEditId) return;
            schedules = schedules.filter(s => s.id !== currentEditId);
            closeModal();
            renderSchedule();
        }

        // エクスポート・インポート機能
        function exportData() {
            const data = {
                todos,
                dailies,
                monthlies,
                recurrings,
                schedules
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('import-file').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.todos) todos = data.todos;
                    if (data.dailies) dailies = data.dailies;
                    if (data.monthlies) monthlies = data.monthlies;
                    if (data.recurrings) recurrings = data.recurrings;
                    if (data.schedules) schedules = data.schedules;

                    renderTodos();
                    renderDailies();
                    renderMonthlies();
                    renderRecurrings();
                    renderSchedule();

                    alert('データをインポートしました。');
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // 初期化
        populateTimeSelects();
        renderSchedule();
    </script>
</body>
</html>
